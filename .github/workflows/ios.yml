name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  kit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (RMStudioKit)
        working-directory: ios/Packages/RMStudioKit
        run: swift test
  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild build -project RMStudio.xcodeproj -scheme RMStudio \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -40
      - name: UI tests
        working-directory: ios
        run: |
          xcodebuild test -project RMStudio.xcodeproj -scheme RMStudio \
            -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO | tail -40
