name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  kit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (RMStudioKit)
        working-directory: ios/Packages/RMStudioKit
        run: swift test 2>&1 | tail -150; exit ${PIPESTATUS[0]}

  app-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project RMStudio.xcodeproj -scheme RMStudio \
            -destination 'generic/platform=iOS' -archivePath build/RMStudio.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|warning: unre|ARCHIVE|BUILD" | head -80
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload && cp -R build/RMStudio.xcarchive/Products/Applications/RMStudio.app Payload/
          zip -qry RMStudio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RMStudio-unsigned-ipa
          path: ios/RMStudio-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log

  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16') and 'Pro' not in x['name'] and 'Plus' not in x['name']][0])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot $UDID
      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project RMStudio.xcodeproj -scheme RMStudio -destination "id=$UDID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD" | head -80
      - name: UI tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project RMStudio.xcodeproj -scheme RMStudio -destination "id=$UDID" \
            -only-testing:RMStudioUITests/SignInUITests \
            -derivedDataPath build -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case|TEST|Executed" | head -60
      - name: Fixture tour (screenshot every tab)
        if: always()
        working-directory: ios
        run: |
          mkdir -p shots
          set -o pipefail
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/shots" xcodebuild test -project RMStudio.xcodeproj -scheme RMStudio \
            -destination "id=$UDID" -only-testing:RMStudioUITests/FixtureTourUITests \
            -derivedDataPath build -resultBundlePath build/tour.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee tour.log | grep -E "error:|Test Case|TEST|Executed" | head -40
      - name: Tour notes
        if: always()
        working-directory: ios
        run: |
          ls shots | head -60
          echo "--- notes.txt ---"; cat shots/notes.txt || true
          grep -E "error:|Failed" tour.log | head -20 || true
      - name: Launch signed-out app and screenshot
        if: always()
        working-directory: ios
        run: |
          APP=$(find build/Build/Products -name RMStudio.app -maxdepth 3 | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl launch $UDID com.rmmedia.studio.ios -ui-testing-signed-out
          sleep 6
          xcrun simctl io $UDID screenshot signin.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: |
            ios/signin.png
            ios/shots
            ios/tour.log
            ios/build.log
            ios/test.log
            ios/build/ui.xcresult

  mac-catalyst:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build Mac app (ad-hoc signed)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project RMStudio.xcodeproj -scheme RMStudio -configuration Release \
            -destination 'platform=macOS,variant=Mac Catalyst' -derivedDataPath build-mac \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" 2>&1 | tee mac-build.log | grep -E "error:|BUILD" | head -60
      - name: Package .app
        working-directory: ios
        run: |
          APP=$(find build-mac/Build/Products -name RMStudio.app -maxdepth 3 | head -1)
          echo "APP=$APP"; codesign -dv "$APP" 2>&1 | head -5 || true
          ditto -c -k --keepParent "$APP" RMStudio-mac.zip
      - name: Launch and screenshot
        working-directory: ios
        continue-on-error: true
        run: |
          APP=$(find build-mac/Build/Products -name RMStudio.app -maxdepth 3 | head -1)
          open "$APP" --args -ui-testing-signed-out
          sleep 10
          pgrep -x RMStudio && echo "RUNNING" || echo "NOT RUNNING"
          screencapture -x mac-signin.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RMStudio-mac
          path: |
            ios/RMStudio-mac.zip
            ios/mac-signin.png
            ios/mac-build.log
