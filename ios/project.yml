name: RMStudio
options:
  bundleIdPrefix: com.rmmedia
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  RMStudioKit:
    path: Packages/RMStudioKit
targets:
  RMStudio:
    type: application
    platform: iOS
    sources:
      - RMStudio
    dependencies:
      - package: RMStudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rmmedia.studio.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": RMStudio/RMStudioMac.entitlements
    info:
      path: RMStudio/Info.plist
      properties:
        CFBundleDisplayName: RM Studio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.rmmedia.studio
            CFBundleURLSchemes: [rmstudio]
        RMStudioBaseURL: https://rmmedia-studio.vercel.app
        LSApplicationQueriesSchemes: [googlegmail, ms-outlook]
        ITSAppUsesNonExemptEncryption: false
  RMStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RMStudioUITests
    dependencies:
      - target: RMStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rmmedia.studio.ios.uitests
schemes:
  RMStudio:
    build:
      targets:
        RMStudio: all
    test:
      targets:
        - RMStudioUITests
